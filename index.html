<!DOCTYPE html>
<html lang="es">
<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximun-scale=1.0, minimum-scale=1.0">
	<link href="css/bootstrap.css" rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css?family=Lato:100,300" rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css?family=Raleway:800,800i" rel="stylesheet" />
	<link href="css/estilos.css" rel="stylesheet" />
	<link href="css/animations.css" rel="stylesheet" />
	<link href="fonts/style.css" rel="stylesheet" />
	<link href="img/favicon.ico" rel="icon" type="image/x-icon" />
	<title>SEM CONSTRUCCIONES SRL - Servicios el&eacute;ctricos en Rosario</title>
	<script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom animation for the background gradient */
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-gradient {
            background: linear-gradient(-45deg, #f8fafc, #e2e8f0, #f8fafc, #cbd5e1);
            background-size: 400% 400%;
            animation: gradient-animation 15s ease infinite;
        }
        /* Custom animation for content fade-in */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 1.5s ease-out forwards;
        }
        /* Styling for the countdown timer numbers */
        .countdown-number {
            font-weight: 900; /* Black weight */
            line-height: 1;
        }
        /* --- SVG Animation Styles --- */
        @keyframes hammer {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(20deg); }
        }
        @keyframes lift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes bulb-glow {
            0% { fill: #e0e0e0; }
            80% { fill: #e0e0e0; }
            100% { fill: #ffffff; filter: drop-shadow(0 0 15px #fef08a); }
        }
        .arm-hammer { animation: hammer 2s ease-in-out infinite; transform-origin: top right; }
        .figure-lift { animation: lift 3s ease-in-out infinite; }
        .bulb-glass { animation: bulb-glow 5s ease-in-out infinite 1s; }
    </style>
</head>
  <body class="animated-gradient text-slate-800">

    <main class="flex items-center justify-center min-h-screen p-4 sm:p-6 lg:p-8">
        <!-- Main container with a new two-column layout on medium screens and up -->
        <div class="w-full max-w-6xl mx-auto bg-white/80 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden fade-in">
            
                <!-- Right Side: Content -->
                <div class="p-8 sm:p-10 lg:p-12 text-center flex flex-col justify-center">
                  
                    <!-- Logo Section -->
                    <div class="mb-6">
                        <img src="img/Bulb.png" alt="Logo SEM Construcciones SRL" class="mx-auto h-24 w-auto inline" >
                        <img src="img/SEM.png" alt="Logo SEM Construcciones SRL" class="mx-auto h-20 w-auto inline" style="margin-left: 10px;">
                    </div>

                    <!-- Header Text -->
                    <h1 class="text-3xl sm:text-4xl md:text-5xl font-black text-slate-900 tracking-tight">
                        Nuestro sitio web está en construcción
                    </h1>
                    <p class="mt-4 max-w-xl mx-auto text-base sm:text-lg text-slate-600">
                        Estamos trabajando para crear una experiencia digital increíble. ¡Vuelve pronto!
                    </p>

                    <!-- Countdown Timer -->
                    <div id="countdown" class="mt-8 flex justify-center items-center space-x-2 sm:space-x-4 text-slate-900">
                        <div>
                            <div id="days" class="text-3xl sm:text-5xl countdown-number">00</div>
                            <div class="text-xs uppercase tracking-widest text-slate-500">Días</div>
                        </div>
                        <div class="text-2xl sm:text-4xl text-slate-300">:</div>
                        <div>
                            <div id="hours" class="text-3xl sm:text-5xl countdown-number">00</div>
                            <div class="text-xs uppercase tracking-widest text-slate-500">Horas</div>
                        </div>
                        <div class="text-2xl sm:text-4xl text-slate-300">:</div>
                        <div>
                            <div id="minutes" class="text-3xl sm:text-5xl countdown-number">00</div>
                            <div class="text-xs uppercase tracking-widest text-slate-500">Minutos</div>
                        </div>
                        <div class="text-2xl sm:text-4xl text-slate-300">:</div>
                        <div>
                            <div id="seconds" class="text-3xl sm:text-5xl countdown-number">00</div>
                            <div class="text-xs uppercase tracking-widest text-slate-500">Segundos</div>
                        </div>
                    </div>

                    <!-- Contact Information -->
                    <div class="mt-10">
                        <p class="text-slate-600">¿Necesitas contactarnos?</p>
                        <a href="mailto:contacto@semconstruccionessrl.com" class="mt-1 inline-block text-lg font-bold text-[#5EAF4B] hover:text-green-700 transition-colors duration-300">
                            contacto@semconstruccionessrl.com
                        </a>
                    </div>
                </div>
            
        </div>
    </main>

    <script>
        // --- Countdown Timer Logic ---
        const countDownDate = new Date("Oct 15, 2025 09:00:00");
        countDownDate.setDate(countDownDate.getDate());
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            daysEl.innerHTML = String(days).padStart(2, '0');
            hoursEl.innerHTML = String(hours).padStart(2, '0');
            minutesEl.innerHTML = String(minutes).padStart(2, '0');
            secondsEl.innerHTML = String(seconds).padStart(2, '0');
            
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<div class='text-2xl font-bold text-green-600'>¡Nuestro sitio ya está en vivo!</div>";
            }
        }, 1000);
    </script>

  </body>
</html>
